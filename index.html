<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pogoda — Zambski Kościelne</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg-0:#000000; --bg-1:#000000; --panel:#0a0e15; --panel-2:#070a10;
    --line:#1b2636; --ink:#eef4fb; --ink-dim:#8ea0b6; --ink-faint:#5b6b80;
    --acc:#57b6ff; --acc-soft:rgba(87,182,255,.14);
    --good:#57d99a; --warn:#ffcf5c; --cold:#6fa8ff; --hot:#ff8a6b; --sun:#ffd166;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --num:"Sora","IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:var(--sans); color:var(--ink);
    background:#000;
  }
  .stage {
    height:100%; max-width:1920px; margin:0 auto;
    padding:clamp(12px,2vw,34px);
    display:grid; grid-template-rows:auto 1fr auto; gap:clamp(10px,1.4vw,22px);
  }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .clock {
    display:inline-flex; align-items:baseline; align-self:flex-end;
    font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums;
    font-size:clamp(1.7rem,4vw,3.4rem); line-height:1; letter-spacing:.01em;
    color:var(--ink);
    background:linear-gradient(180deg,#121826,#090d14);
    border:1px solid var(--line); border-radius:16px;
    padding:.34em .62em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06),
                inset 0 0 0 4px rgba(0,0,0,.28),
                0 10px 22px rgba(0,0,0,.5);
    text-shadow:0 0 14px rgba(87,182,255,.28);
  }
  .clock .sec { color:var(--ink-faint); font-size:.62em; text-shadow:none; }
  .head-right { text-align:right; }
  .place {
    font-family:var(--mono); text-transform:uppercase; letter-spacing:.2em;
    font-size:clamp(.62rem,1vw,.82rem); color:var(--ink-faint);
  }
  .date { color:var(--ink); font-weight:500; font-size:clamp(1rem,1.9vw,1.65rem); margin-top:.45em; }
  .nameday { color:var(--ink-dim); font-size:clamp(.8rem,1.3vw,1.05rem); margin-top:.55em; font-weight:400; }
  .nameday b { color:var(--acc); font-weight:600; }
  .event { color:var(--ink-dim); font-size:clamp(.8rem,1.3vw,1.05rem); margin-top:.15em;
    max-width:min(48ch,58vw); margin-left:auto; line-height:1.4; }
  .status {
    display:inline-flex; align-items:center; gap:.5em; font-family:var(--mono);
    font-size:clamp(.6rem,1.1vw,.8rem); letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim); margin-top:.5em;
  }
  .dot { width:.62em; height:.62em; border-radius:50%; background:var(--good);
    box-shadow:0 0 0 0 rgba(87,217,154,.5); animation:pulse 2.4s infinite; }
  .dot.err { background:var(--hot); animation:none; }
  @keyframes pulse {
    0%{box-shadow:0 0 0 0 rgba(87,217,154,.45);}
    70%{box-shadow:0 0 0 .7em rgba(87,217,154,0);}
    100%{box-shadow:0 0 0 0 rgba(87,217,154,0);}
  }

  .hero {
    border:1px solid var(--line); border-radius:clamp(16px,1.6vw,28px);
    padding:clamp(18px,2.6vw,48px);
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    display:grid; grid-template-columns:auto 1fr; align-items:center; gap:clamp(20px,4vw,72px);
    position:relative; overflow:hidden;
  }
  .hero::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--acc); opacity:.85; }
  /* spacerujacy saperzy - nakladka na hero, nie zmienia ukladu */
  .walkers { position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .walk-train { position:absolute; left:0; bottom:0; width:100%; height:100%; display:none; will-change:transform; }
  .walkers.go .walk-train { display:block; animation:walkAcross 22s linear 1 forwards; }
  .walk-group { position:absolute; right:100%; bottom:0; height:92%; display:flex; align-items:flex-end; gap:6%; }
  .walk-group img { height:100%; width:auto; display:block; }
  .walkers.go .walk-group img { animation:walkBob .55s ease-in-out infinite alternate; }
  .walkers.go .walk-group img + img { animation-delay:-.27s; }
  @keyframes walkAcross { from{ transform:translateX(0); } to{ transform:translateX(135%); } }
  @keyframes walkBob { from{ transform:translateY(0) rotate(-1.5deg); } to{ transform:translateY(-3%) rotate(1.5deg); } }
  /* kot chodzacy po gornej krawedzi hero jak po plocie - pozycje ustawia JS */
  #fenceCat { position:fixed; z-index:6; pointer-events:none; overflow:hidden; display:none; }
  #fenceCat.go { display:block; }
  #fenceCat svg { position:absolute; bottom:0; left:-16%; height:100%; width:auto; display:block;
    filter:drop-shadow(0 0 1.5px rgba(205,218,238,.75)); }
  #fenceCat.go svg { animation:catWalk 30s linear 1 forwards; }
  @keyframes catWalk { from{ left:-16%; } to{ left:100%; } }
  .hero-current { display:flex; flex-direction:column; gap:.1em; min-width:0; }
  .temp {
    font-family:var(--num); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(4rem,11vw,9.5rem); line-height:.82; letter-spacing:-.03em;
  }
  .temp .unit { font-size:.3em; font-weight:600; color:var(--ink-dim); vertical-align:top; margin-left:.1em; }
  .temp.cold{color:var(--cold);} .temp.mild{color:var(--ink);} .temp.hot{color:var(--hot);}
  .cond-row { display:flex; align-items:center; gap:.5em; margin-top:.2em; }
  .cond-icon { color:var(--acc); flex:0 0 auto; }
  .cond-icon svg { width:clamp(34px,4vw,64px); height:auto; }
  .cond { font-size:clamp(1.2rem,2.8vw,2.4rem); color:var(--ink); font-weight:500; }
  .feels { font-family:var(--mono); color:var(--ink-dim); font-size:clamp(.8rem,1.5vw,1.15rem); letter-spacing:.06em; margin-top:.55em; }

  .hero-stats {
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:clamp(14px,1.7vw,26px) clamp(14px,2vw,34px);
  }
  .hero-stats .st { display:flex; flex-direction:column; gap:.3em;
    padding-left:clamp(12px,1.5vw,26px); border-left:1px solid var(--line); }
  .hero-stats .st:nth-child(4n+1) { padding-left:0; border-left:0; }
  .hero-stats .v small { color:var(--ink-dim); }
  .hero-stats .k { font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em;
    font-size:clamp(.6rem,.95vw,.78rem); color:var(--ink-faint); }
  .hero-stats .v { font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums;
    font-size:clamp(1.15rem,2.1vw,1.85rem); color:var(--ink); display:flex; align-items:baseline; gap:.28em; }
  .hero-stats .v small { font-size:.5em; color:var(--ink-dim); font-weight:500; }
  .hero .find { position:absolute; right:clamp(18px,2.6vw,48px); bottom:clamp(18px,2.6vw,48px); width:clamp(70px,7.5vw,150px); height:auto; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)); }

  /* karta prognozy: godzinowa + dni */
  .fc {
    border:1px solid var(--line); border-radius:clamp(16px,1.6vw,28px);
    padding:clamp(14px,1.9vw,30px);
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    display:flex; flex-direction:column; gap:clamp(12px,1.5vw,22px);
  }
  .fc-label { font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
    font-size:clamp(.6rem,.95vw,.78rem); color:var(--ink-faint); }
  .hourly { display:flex; align-items:center; justify-content:space-between; gap:clamp(6px,1vw,16px); }
  .hr { display:flex; flex-direction:column; align-items:center; gap:.4em; }
  .hr .hh { font-family:var(--mono); font-size:clamp(.6rem,.95vw,.8rem);
    letter-spacing:.06em; color:var(--ink-faint); }
  .hr .hic { color:var(--acc); opacity:.85; }
  .hr .hic svg { width:clamp(22px,2.3vw,34px); height:auto; }
  .hr .ht { font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums;
    font-size:clamp(.95rem,1.6vw,1.4rem); color:var(--ink); }

  .strip { display:grid; grid-template-columns:repeat(6,1fr); gap:clamp(10px,1.2vw,18px); }
  .chip {
    border:1px solid var(--line); border-radius:clamp(12px,1.2vw,20px);
    padding:clamp(10px,1.2vw,18px) clamp(12px,1.3vw,20px);
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
    display:flex; flex-direction:column; gap:.35em;
  }
  .chip .k { font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em;
    font-size:clamp(.58rem,.95vw,.76rem); color:var(--ink-faint); }
  .chip .v { font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums;
    font-size:clamp(1.1rem,2.3vw,1.9rem); display:flex; align-items:baseline; gap:.3em; }
  .chip .v small { font-size:.5em; color:var(--ink-dim); font-weight:500; }
  .arrow { display:inline-block; color:var(--acc); }
  .sunv { color:var(--sun); }

  /* prognoza na kolejne dni (wewnatrz karty .fc) */
  .forecast { display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(10px,1.2vw,20px);
    border-top:1px solid var(--line); padding-top:clamp(12px,1.5vw,22px); }
  .day {
    display:flex; flex-direction:column; align-items:center; gap:.5em; text-align:center;
  }
  .day .dname { font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em;
    font-size:clamp(.6rem,1vw,.82rem); color:var(--ink-dim); }
  .day.today .dname { color:var(--acc); }
  .day .dicon { color:var(--acc); }
  .day .dicon svg { width:clamp(34px,4vw,56px); height:auto; }
  .day .dtemp { font-family:var(--num); font-weight:600; font-variant-numeric:tabular-nums;
    font-size:clamp(1.1rem,2.4vw,1.9rem); }
  .day .dtemp .lo { color:var(--ink-faint); font-weight:500; }

  @media (max-width:900px){
    .hero{ grid-template-columns:1fr; gap:clamp(18px,4vw,30px); }
    .hero-current{ align-items:center; text-align:center; }
    .cond-row{ justify-content:center; }
    .hero-stats{ grid-template-columns:repeat(3,1fr); }
    .hero .find{ position:static; transform:none; justify-self:center; }
    .hero-stats .st{ padding-left:clamp(12px,1.5vw,26px); border-left:1px solid var(--line); }
    .hero-stats .st:nth-child(3n+1){ padding-left:0; border-left:0; }
    .hourly{ display:none; }
    .stage{ grid-template-rows:auto auto auto auto; height:auto; min-height:100%; }
  }
  @media (max-width:560px){
    .hero-stats{ grid-template-columns:1fr 1fr; }
    .hero-stats .st{ padding-left:clamp(14px,4vw,26px); border-left:1px solid var(--line); }
    .hero-stats .st:nth-child(2n+1){ padding-left:0; border-left:0; }
    .forecast{ grid-template-columns:1fr 1fr 1fr; }
    .day:nth-child(4),.day:nth-child(5){ display:none; }
  }
  /* ziomek wyglada zza rogu i tanczy: na zmiane prawy dolny / lewy gorny (tylko transform+opacity - lekkie dla TV) */
  .peek { position:fixed; z-index:90; pointer-events:none; height:46vh; display:none; will-change:transform; }
  .peek .pk-in { position:relative; height:100%; }
  .peek .pk-dance { position:relative; height:100%; transform-origin:85% 100%; will-change:transform; }
  .peek img { position:relative; height:46vh; width:auto; display:block; }
  .peek .pk-glow { position:absolute; left:50%; top:45%; width:50vh; height:50vh; border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,90,.55) 0%, rgba(255,214,90,.18) 38%, transparent 68%);
    transform:translate(-50%,-50%) scale(.2); opacity:0; }
  .peek .pk-notes { position:absolute; width:30%; height:60%; }
  .peek.br .pk-notes { left:-18%; top:0; }
  .peek.tl .pk-notes { right:-18%; bottom:5%; }
  .pk-notes span { position:absolute; bottom:0; font:700 clamp(28px,4.4vh,54px)/1 var(--sans,sans-serif); color:#ffd65a; opacity:0; }
  .pk-notes span:nth-child(1){ left:10%; } .pk-notes span:nth-child(2){ left:55%; color:#7cc4ff; } .pk-notes span:nth-child(3){ left:30%; }
  .peek.br { right:0; bottom:0; }
  .peek.tl { left:0; top:0; }
  .peek.tl .pk-in { transform:rotate(180deg); }
  .peek.go { display:block; }
  .peek.go.br { animation:peekBR 9s ease-out 1 forwards; }
  .peek.go.tl { animation:peekTL 9s ease-out 1 forwards; }
  .peek.go .pk-glow { animation:peekGlow 9s ease-out 1 forwards; }
  .peek.go .pk-dance { animation:peekDance .42s ease-in-out 1.3s 15 alternate both; }
  .peek.go .pk-notes span { animation:peekNote 1.6s ease-out 1.4s 4; }
  .peek.go .pk-notes span:nth-child(2){ animation-delay:1.9s; } .peek.go .pk-notes span:nth-child(3){ animation-delay:2.4s; }
  @keyframes peekBR {
    0%   { transform:translate(85%,85%) rotate(-28deg); }
    7%   { transform:translate(-3%,-3%) rotate(5deg); }
    10%  { transform:translate(1%,1%) rotate(-2deg); }
    13%,86% { transform:translate(0,0) rotate(0); }
    100% { transform:translate(85%,85%) rotate(-28deg); }
  }
  @keyframes peekTL {
    0%   { transform:translate(-85%,-85%) rotate(-28deg); }
    7%   { transform:translate(3%,3%) rotate(5deg); }
    10%  { transform:translate(-1%,-1%) rotate(-2deg); }
    13%,86% { transform:translate(0,0) rotate(0); }
    100% { transform:translate(-85%,-85%) rotate(-28deg); }
  }
  @keyframes peekDance {
    0%   { transform:scale(1.08) rotate(-6deg) translateY(0); }
    50%  { transform:scale(1.08,1.11) rotate(0deg) translateY(-4%); }
    100% { transform:scale(1.08,1.05) rotate(6deg) translateY(0); }
  }
  @keyframes peekNote {
    0%   { opacity:0; transform:translate(0,0) rotate(-10deg) scale(.6); }
    20%  { opacity:1; }
    100% { opacity:0; transform:translate(25%,-220%) rotate(15deg) scale(1.1); }
  }
  @keyframes peekGlow {
    0%,3% { opacity:0; transform:translate(-50%,-50%) scale(.2); }
    8%    { opacity:1; transform:translate(-50%,-50%) scale(1.05); }
    18%   { opacity:.35; transform:translate(-50%,-50%) scale(.95); }
    86%   { opacity:.25; transform:translate(-50%,-50%) scale(.95); }
    100%  { opacity:0; transform:translate(-50%,-50%) scale(.4); }
  }
  @media (prefers-reduced-motion:reduce){ .peek.go.br,.peek.go.tl,.peek.go .pk-glow,.peek.go .pk-dance,.peek.go .pk-notes span{ animation-duration:.01s; } }
  #startOverlay {
    position:fixed; inset:0; z-index:100; border:0; margin:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(0,0,0,.9); color:var(--ink); font-family:var(--sans);
  }
  #startOverlay:focus-visible { outline:none; }
  .ov-card { display:flex; flex-direction:column; align-items:center; gap:.4em; text-align:center; padding:2em; }
  .ov-big { font-family:var(--num); font-weight:700; font-size:clamp(1.6rem,4.5vw,3.4rem); color:var(--acc); }
  .ov-sub { color:var(--ink-dim); font-size:clamp(1rem,2.2vw,1.5rem); margin-top:.3em; }
  .ov-sub b { color:var(--ink); }
  .ov-ok { margin-top:1em; border:2px solid var(--acc); color:var(--acc);
    border-radius:999px; padding:.45em 1.5em; font-family:var(--mono); letter-spacing:.15em;
    font-size:clamp(1rem,2vw,1.4rem); }

  #fsBtn {
    position:fixed; right:clamp(12px,2vw,34px); bottom:clamp(12px,2vw,34px);
    z-index:10; display:inline-flex; align-items:center; gap:.5em;
    font-family:var(--mono); font-size:clamp(.7rem,1.1vw,.9rem); letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); cursor:pointer;
    background:rgba(20,27,39,.85); border:1px solid var(--line);
    border-radius:999px; padding:.6em 1em;
  }
  #fsBtn:hover, #fsBtn:focus-visible { color:var(--ink); border-color:var(--acc); outline:none; }
  #fsBtn svg { width:1.15em; height:1.15em; }


  #radio {
    display:flex; align-items:center; gap:.5em; align-self:center;
    background:rgba(10,14,21,.9); border:1px solid var(--line); border-radius:999px;
    padding:.35em .5em .35em .35em; font-family:var(--mono);
  }
  #radioBtn {
    width:2.2em; height:2.2em; flex:0 0 auto; border-radius:50%;
    border:1px solid var(--line); background:var(--panel); color:var(--acc);
    font-size:clamp(.85rem,1.3vw,1rem); cursor:pointer; line-height:1;
    display:inline-flex; align-items:center; justify-content:center;
  }
  #radioBtn:hover, #radioBtn:focus-visible { border-color:var(--acc); outline:none; }
  #radioBtn.on { color:var(--good); border-color:var(--good); }
  #wheelBtn {
    display:inline-flex; align-items:center; gap:.4em; background:transparent;
    color:var(--ink-dim); border:0; outline:none; cursor:pointer;
    font-family:var(--mono); font-size:clamp(.7rem,1.1vw,.9rem); letter-spacing:.08em;
    padding:.2em .5em; max-width:44vw;
  }
  #wheelBtn:hover, #wheelBtn:focus-visible { color:var(--ink); }
  #wheelBtn .caret { color:var(--acc); font-size:.9em; }

  /* koło wyboru stacji (GTA) */
  #wheel[hidden]{ display:none; }
  #wheel {
    position:fixed; inset:0; z-index:130; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.66);
  }
  .wheel-inner {
    position:relative; width:min(74vmin,540px); height:min(74vmin,540px);
    --r:min(27vmin,196px);
    animation:wheelIn .22s ease-out;
  }
  @keyframes wheelIn { from{ transform:scale(.82); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .wheel-hub {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:40%; height:40%; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #16202f, #090d14);
    border:1px solid var(--line); box-shadow:0 0 40px rgba(0,0,0,.6) inset;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1em;
  }
  .wheel-hub .lbl { font-family:var(--mono); font-size:clamp(.55rem,1vw,.72rem); letter-spacing:.24em;
    text-transform:uppercase; color:var(--ink-faint); }
  .wheel-hub .now { font-family:var(--num); font-weight:700; font-size:clamp(1.1rem,2.8vw,2rem);
    color:var(--acc); margin-top:.35em; line-height:1.05; }
  .wheel-hub .gen { font-family:var(--mono); font-size:clamp(.55rem,1vw,.72rem); color:var(--ink-dim); margin-top:.4em; letter-spacing:.1em; }
  .wheel-item {
    position:absolute; left:50%; top:50%; width:30%;
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1 * var(--r))) rotate(calc(-1 * var(--a)));
    background:rgba(18,25,37,.92); border:1px solid var(--line); border-radius:14px;
    padding:.55em .35em; color:var(--ink-dim); cursor:pointer;
    font-family:var(--num); font-weight:600; font-size:clamp(.66rem,1.4vw,.95rem); text-align:center;
    transition:background .12s, color .12s, border-color .12s, box-shadow .12s;
  }
  .wheel-item.sel {
    background:var(--acc); color:#04121f; border-color:var(--acc);
    box-shadow:0 0 22px rgba(87,182,255,.55);
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1 * var(--r) - 6px)) rotate(calc(-1 * var(--a))) scale(1.14);
  }
  .wheel-hint { position:fixed; bottom:6vh; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:clamp(.6rem,1.1vw,.85rem); letter-spacing:.12em;
    color:var(--ink-dim); text-transform:uppercase; }

  .head-mid { display:flex; flex-direction:column; align-items:center; gap:.55em; }
  .reminder { font-family:var(--num); font-weight:600; font-size:clamp(1rem,2.1vw,1.6rem);
    color:var(--sun); text-align:center; animation:blink 1.3s ease-in-out infinite; }
  .reminder:empty { display:none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  @media (prefers-reduced-motion:reduce){ .reminder{ animation:none; } }

  :fullscreen #fsBtn { display:none; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="clock" id="clock">--:--<span class="sec" id="sec">:--</span></div>
    <div class="head-mid">
      <div id="radio">
        <button id="radioBtn" aria-label="Włącz radio">▶</button>

  <div class="hero">

4"/><ellipse cx="89.5" cy="24.5" rx="1.7" ry="1.2" fill="#d48a9a"/><ellipse cx="85" cy="19.5" rx="2.1" ry="2.4" fill="#d9e65a"/><ellipse cx="85.5" cy="19.5" rx=".8" ry="2" fill="#000"/><path d="M90 27 L98 25.5 M90 28.5 L98 29.5" stroke="#cfcfcf" stroke-width=".5"/></svg></div>

  <span class="ov-card">
    <span class="ov-big">Pogoda · Zambski Kościelne</span>

    <span class="ov-ok">▶ OK</span>

<script src="pogoda-data.js"></script>

<script>
  const $ = id => document.getElementById(id);
  const LAT = 52.7559, LON = 21.2154;
  const dni = ["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
  const mies = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];

  function tickClock(){
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    $("clock").firstChild.nodeValue = p(d.getHours())+":"+p(d.getMinutes());
    $("sec").textContent=":"+p(d.getSeconds());
    const wd = dni[d.getDay()];
    $("date").textContent = wd.charAt(0).toUpperCase()+wd.slice(1)+", "+d.getDate()+" "+mies[d.getMonth()];
    updateDayInfo(d);
    updateReminder(d);
  }

  // migajace komunikaty w wybranych porach (edytuj liste ponizej)
  const REMINDERS = [
    { from:"20:00", to:"20:30", text:"🏋 Czas poćwiczyć" },
    { from:"22:30", to:"03:00", text:"😴 Pora spać" }
  ];
  const toMin = hhmm => { const [h,m]=hhmm.split(":").map(Number); return h*60+m; };
  const inWindow = (n,a,b) => a<=b ? (n>=a && n<=b) : (n>=a || n<=b); // b<a = przez pólnoc
  function updateReminder(d){
    const n = d.getHours()*60 + d.getMinutes();
    let msg = "";
    for (const r of REMINDERS){ if (inWindow(n, toMin(r.from), toMin(r.to))){ msg = r.text; break; } }
    $("reminder").textContent = msg;
  }
  function updateDayInfo(d){
    const key = (d.getMonth()+1)+"-"+d.getDate();
    if (typeof IMIENINY!=="undefined" && IMIENINY[key])
      $("nameday").innerHTML = "Imieniny: <b>"+IMIENINY[key].join(", ")+"</b>";
    else $("nameday").textContent = "";
    if (typeof SWIETA!=="undefined" && SWIETA[key])
      $("event").textContent = SWIETA[key].join(" · ");
    else $("event").textContent = "";
  }
  setInterval(tickClock,1000); tickClock();

  // WMO weather codes -> [opis, typ ikony]
  const WMO = {
    0:["Bezchmurnie","sun"], 1:["Przeważnie słonecznie","sun"], 2:["Częściowe zachmurzenie","cloud-sun"],
    3:["Pochmurno","cloud"], 45:["Mgła","fog"], 48:["Mgła (szadź)","fog"],
    51:["Mżawka","rain"], 53:["Mżawka","rain"], 55:["Gęsta mżawka","rain"],
    56:["Marznąca mżawka","rain"], 57:["Marznąca mżawka","rain"],
    61:["Lekki deszcz","rain"], 63:["Deszcz","rain"], 65:["Ulewny deszcz","rain"],
    66:["Marznący deszcz","rain"], 67:["Marznący deszcz","rain"],
    71:["Lekki śnieg","snow"], 73:["Śnieg","snow"], 75:["Intensywny śnieg","snow"], 77:["Śnieg ziarnisty","snow"],
    80:["Przelotny deszcz","rain"], 81:["Przelotny deszcz","rain"], 82:["Gwałtowne przelotne deszcze","rain"],
    85:["Przelotny śnieg","snow"], 86:["Przelotny śnieg","snow"],
    95:["Burza","storm"], 96:["Burza z gradem","storm"], 99:["Burza z gradem","storm"]
  };
  const ICONS = {
    sun:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>`,
    "cloud-sun":`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M4 4l1 1M12 12l1 1M12 4l-1 1"/><path d="M10 19a4 4 0 0 1 4-4 4.5 4.5 0 0 1 4.4 3.6A3 3 0 0 1 18 22H8a3 3 0 0 1-.3-6"/></svg>`,
    cloud:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 11.5 3.5 3.5 0 0 1 17.5 18H7z"/></svg>`,
    rain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 8.5 3.5 3.5 0 0 1 17.5 15H7z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>`,
    snow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 8.5 3.5 3.5 0 0 1 17.5 15H7z"/><path d="M9 19v.01M13 19v.01M11 21v.01M15 21v.01"/></svg>`,
    fog:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h16M4 13h16M6 17h12M6 5h12"/></svg>`,
    storm:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14a4 4 0 0 1 .4-8A5.5 5.5 0 0 1 18 7.5 3.5 3.5 0 0 1 17.5 14"/><path d="M12 12l-2 4h3l-2 4"/></svg>`
  };
  function tempClass(t){ return t<=10?"cold":t>=24?"hot":"mild"; }
  const hhmm = iso => iso ? iso.slice(11,16) : "—";

  async function load(){
    const url = "https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON
      +"&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index"
      +"&hourly=temperature_2m,weather_code"
      +"&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FWarsaw&forecast_days=5";
    try {
      const r = await fetch(url, { cache:"no-store" });
      if(!r.ok) throw new Error();
      const j = await r.json(), c = j.current, d = j.daily;
      const t = c.temperature_2m;
      $("temp").innerHTML = t.toFixed(1)+'<span class="unit">°C</span>';
      $("temp").className = "temp "+tempClass(t);
      const [desc, ic] = WMO[c.weather_code] || ["—","cloud"];
      $("cond").textContent = desc;
      $("icon").innerHTML = ICONS[ic] || ICONS.cloud;
      $("feels").textContent = "odczuwalna "+c.apparent_temperature.toFixed(1)+"°";
      $("hum").textContent = Math.round(c.relative_humidity_2m);
      $("wind").textContent = c.wind_speed_10m.toFixed(0);
      $("windArr").style.transform = "rotate("+(c.wind_direction_10m+180)+"deg)";
      $("press").textContent = Math.round(c.surface_pressure);
      const uv = Math.max(0, Math.round(c.uv_index ?? 0));
      $("uv").textContent = uv;
      const uvInfo = uv<=2 ? ["niski","var(--good)"] : uv<=5 ? ["umiarkowany","var(--sun)"]
        : uv<=7 ? ["wysoki","#ff9f45"] : uv<=10 ? ["b. wysoki","var(--hot)"] : ["ekstremalny","#e879f9"];
      $("uvDesc").textContent = uvInfo[0];
      $("uv").style.color = uvInfo[1];
      $("prec").textContent = c.precipitation.toFixed(1);
      $("tmin").textContent = Math.round(d.temperature_2m_min[0]);
      $("tmax").textContent = Math.round(d.temperature_2m_max[0]);
      $("sunrise").textContent = hhmm(d.sunrise[0]);
      $("sunset").textContent = hhmm(d.sunset[0]);
      $("upd").textContent = " · " + new Date().toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});

      // prognoza godzinowa (srodek) - co 2h, 6 slupkow
      const H = j.hourly;
      if (H && H.time){
        const now = new Date();
        let s = H.time.findIndex(t => new Date(t) > now);
        if (s < 0) s = 0;
        let hh = "";
        for (let k=0; k<12 && s+k<H.time.length; k+=2){
          const i = s+k;
          const [,hic] = WMO[H.weather_code[i]] || ["","cloud"];
          hh += '<div class="hr"><span class="hh">'+H.time[i].slice(11,16)+'</span>'
              + '<span class="hic">'+(ICONS[hic]||ICONS.cloud)+'</span>'
              + '<span class="ht">'+Math.round(H.temperature_2m[i])+'°</span></div>';
        }
        $("hourly").innerHTML = hh;
      }

      // prognoza na kolejne dni
      const nazwy = ["Ndz","Pon","Wt","Śr","Czw","Pt","Sob"];
      let fh = "";
      for(let i=0;i<d.time.length;i++){
        const dt = new Date(d.time[i]+"T12:00");
        const lbl = i===0 ? "Dziś" : (i===1 ? "Jutro" : nazwy[dt.getDay()]);
        const [, dic] = WMO[d.weather_code[i]] || ["","cloud"];
        fh += '<div class="day'+(i===0?" today":"")+'">'
            + '<span class="dname">'+lbl+'</span>'
            + '<span class="dicon">'+(ICONS[dic]||ICONS.cloud)+'</span>'
            + '<span class="dtemp">'+Math.round(d.temperature_2m_max[i])+'° <span class="lo">'+Math.round(d.temperature_2m_min[i])+'°</span></span>'
            + '</div>';
      }
      $("forecast").innerHTML = fh;

      $("dot").className = "dot";
      $("statusTxt").textContent = "Na żywo · Open-Meteo";
    } catch(e){
      $("dot").className = "dot err";
      $("statusTxt").textContent = "Brak połączenia";
    }
  }
  load();
  setInterval(load, 10*60*1000); // co 10 minut


  // przycisk pełnego ekranu — pokaż tylko gdy przeglądarka to wspiera
  (function(){
    const b = $("fsBtn");
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (req) {
      b.hidden = false;
      b.addEventListener("click", () => {
        try { (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el); }
        catch(e){}
      });
    }
  })();

  // radio + kolo wyboru stacji (styl GTA)
  (function(){
    const STATIONS = [
      { name:"Nightride FM", gen:"synthwave · bez reklam",  url:"https://stream.nightride.fm/nightride.mp3" },
      { name:"Chillsynth", gen:"synthwave chill · bez reklam", url:"https://stream.nightride.fm/chillsynth.mp3" },
      { name:"80s80s", gen:"lata 80",                          url:"https://streams.80s80s.de/web/mp3-192/streams.80s80s.de/" },
      { name:"Radio Paradise", gen:"mix · bez reklam", url:"https://stream.radioparadise.com/aac-128" },
      { name:"RP Mellow", gen:"spokojne · bez reklam", url:"https://stream.radioparadise.com/mellow-128" },
      { name:"RP Rock", gen:"rock · bez reklam",       url:"https://stream.radioparadise.com/rock-128" },
      { name:"Swiss Pop", gen:"hity · bez reklam",     url:"https://stream.srg-ssr.ch/m/rsp/mp3_128" },
      { name:"Swiss Jazz", gen:"jazz · bez reklam",    url:"https://stream.srg-ssr.ch/m/rsj/mp3_128" },
      { name:"Swiss Classic", gen:"klasyka · bez reklam", url:"https://stream.srg-ssr.ch/m/rsc_de/mp3_128" }
    ];
    const player=$("player"), rbtn=$("radioBtn"), wheel=$("wheel"), inner=$("wheelInner");
    let playing=false, current=0, sel=0;

    let actx;
    function blip(f){
      try{
        if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
        if(actx.state==="suspended") actx.resume();
        const o=actx.createOscillator(), g=actx.createGain();
        o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.06, actx.currentTime+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.12);
        o.start(); o.stop(actx.currentTime+0.13);
      }catch(e){}
    }

    const items=[];
    STATIONS.forEach((s,i)=>{
      const el=document.createElement("button");
      el.className="wheel-item";
      el.style.setProperty("--a", (360/STATIONS.length)*i + "deg");
      el.innerHTML="<div>"+s.name+"</div>";
      el.addEventListener("mouseenter", ()=> setSel(i));
      el.addEventListener("click", ()=>{ setSel(i); choose(); });
      inner.appendChild(el); items.push(el);
    });

    function renderSel(){
      items.forEach((el,i)=> el.classList.toggle("sel", i===sel));
      $("wheelNow").textContent = STATIONS[sel].name;
      $("wheelGen").textContent = STATIONS[sel].gen;
    }
    function setSel(i){
      i=(i+STATIONS.length)%STATIONS.length;
      if(i===sel) return;
      sel=i; blip(520 + sel*26); renderSel();
    }
    function label(){ $("wheelBtnName").textContent = STATIONS[current].name; }
    function play(i){
      current=i; player.src=STATIONS[i].url;
      player.play().then(()=>{ playing=true; rbtn.textContent="⏸"; rbtn.classList.add("on"); })
        .catch(()=>{ rbtn.textContent="▶"; });
      label();
    }
    function choose(){ blip(880); play(sel); closeWheel(); }
    function openWheel(){ sel=current; renderSel(); wheel.hidden=false; blip(680); }
    function closeWheel(){ wheel.hidden=true; }

    rbtn.addEventListener("click", ()=>{
      if(!playing) play(current);
      else { player.pause(); playing=false; rbtn.textContent="▶"; rbtn.classList.remove("on"); }
    });
    $("wheelBtn").addEventListener("click", openWheel);
    wheel.addEventListener("click", (e)=>{ if(e.target===wheel) closeWheel(); });
    document.addEventListener("keydown", (e)=>{
      if(wheel.hidden) return;
      if(e.key==="ArrowRight"||e.key==="ArrowDown"){ setSel(sel+1); e.preventDefault(); }
      else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ setSel(sel-1); e.preventDefault(); }
      else if(e.key==="Enter"||e.key===" "){ choose(); e.preventDefault(); }
      else if(e.key==="Escape"||e.key==="Backspace"){ closeWheel(); e.preventDefault(); }
    }, true);

    label();
    window._radioStart = ()=>{ if(!playing) play(current); };
  })();

  // nakladka startowa: jedno OK -> pelny ekran + radio
  (function(){
    const ov = $("startOverlay");
    if (!ov) return;
    function startAll(){
      try { const el = document.documentElement;
        const rf = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (rf) rf.call(el);
      } catch(e){}
      try { if (window._radioStart) window._radioStart(); } catch(e){}
      try { if (window._getActx) window._getActx(); } catch(e){}
      document.removeEventListener("keydown", onKey, true);
      ov.remove();
    }
    function onKey(){ startAll(); }
    ov.addEventListener("click", startAll);
    document.addEventListener("keydown", onKey, true);
    try { ov.focus(); } catch(e){}
  })();

  // kontekst audio (blip w kole radia) - tworzony po pierwszym OK
  (function(){
    let actx = null;
    window._getActx = function(){
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
      } catch(e){}
      return actx;
    };
  })();

  // moneta pod "Opady": rowny odstep od wartosci opadow i od dolnej krawedzi panelu
  (function(){
    const coin = document.querySelector(".hero .find"), hero = document.querySelector(".hero"), val = $("prec").parentNode;
    if (!coin || !hero) return;
    function place(){
      const st = coin.style;
      if (window.innerWidth <= 900){ st.left = st.top = st.right = st.bottom = st.width = ""; return; }
      const h = hero.getBoundingClientRect(), v = val.getBoundingClientRect();
      const free = h.bottom - v.bottom;            // miejsce miedzy "mm" a krawedzia panelu
      const size = Math.max(40, Math.min(150, free * 0.7));
      const gap = (free - size) / 2;
      st.right = st.bottom = "auto";
      st.width = size + "px";
      st.left = (v.left - h.left) + "px";
      st.top = (v.bottom - h.top + gap) + "px";
    }
    window.addEventListener("resize", place);
    window.addEventListener("load", place);
    setTimeout(place, 1500);
    place();
  })();

  // kot po plocie: co 4-9 min przechodzi po gornej krawedzi hero (#test -> pierwszy po 5 s)
  (function(){
    const cat = $("fenceCat"), hero = document.querySelector(".hero");
    if (!cat || !hero) return;
    function place(){
      const h = hero.getBoundingClientRect(), size = Math.max(60, Math.min(130, window.innerHeight * 0.115));
      cat.style.left = h.left + "px"; cat.style.width = h.width + "px";
      cat.style.height = size + "px"; cat.style.top = (h.top - size + size * 0.04) + "px";
    }
    cat.querySelector("svg").addEventListener("animationend", function(){ cat.classList.remove("go"); });
    function walk(){ if (cat.classList.contains("go")) return; place(); cat.classList.add("go"); }
    function loop(){ walk(); setTimeout(loop, (4 + Math.random() * 5) * 60 * 1000); }
    window.addEventListener("resize", function(){ if (cat.classList.contains("go")) place(); });
    setTimeout(loop, location.hash === "#test" ? 5000 : 60 * 1000);
  })();

  // saperzy spaceruja po hero co jakis czas (animacja tylko w trakcie przejscia - oszczedza TV)
  (function(){
    const w = document.getElementById("walkers");
    if (!w) return;
    const train = w.querySelector(".walk-train");
    train.addEventListener("animationend", (e)=>{ if (e.animationName === "walkAcross") w.classList.remove("go"); });
    function walk(){ if (!w.classList.contains("go")) w.classList.add("go"); }
    setTimeout(function(){ walk(); setInterval(walk, 5 * 60 * 1000); }, 30 * 1000);
  })();


  // ziomek z nienacka: losowo co 3-7 min, na zmiane prawy dolny i lewy gorny rog
  (function(){
    const pk = document.getElementById("peek");
    if (!pk) return;
    let corner = "br";
    pk.addEventListener("animationend", (e)=>{ if (e.animationName === "peekBR" || e.animationName === "peekTL") pk.classList.remove("go"); });
    function pop(){
      pk.classList.remove("go", "br", "tl");
      pk.classList.add(corner);
      void pk.offsetWidth;
      pk.classList.add("go");
      corner = corner === "br" ? "tl" : "br";
    }
    function loop(){ pop(); setTimeout(loop, (3 + Math.random() * 4) * 60 * 1000); }
    // test na TV: adres z #test -> pierwszy wyskok po 5 s
    var first = (location.hash === "#test") ? 5000 : (1.5 + Math.random() * 1.5) * 60 * 1000;
    setTimeout(loop, first);
    window._peek = pop;
  })();
</script>
