name: Komunikaty lokalne

# co 30 min: wylaczenia pradu PGE (gmina Obryte), komunikaty gminy Obryte i powiatu pultuskiego -> data/komunikaty.json
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: komunikaty
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz komunikaty
        run: python3 scripts/komunikaty.py
      - name: Zapisz, jesli sie zmienily
        run: |
          git config user.name "komunikaty[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/komunikaty.json
          if git diff --cached --quiet; then
            echo "Bez zmian"
          else
            git commit -m "Komunikaty lokalne: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
