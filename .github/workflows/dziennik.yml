name: Dziennik pogody

# co 6 godzin dopisuje godzinowe dane (Open-Meteo + Narew IMGW) do data/dziennik-RRRR.csv
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dziennik
  cancel-in-progress: false

jobs:
  zapis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz i dopisz dane
        run: python3 scripts/dziennik.py
      - name: Zapisz w repozytorium
        run: |
          git config user.name "dziennik-pogody[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Bez zmian"
          else
            git commit -m "Dziennik pogody: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
